apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-engine
  namespace: weatherhub
  labels:
    app: recommendation-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: recommendation-engine
  template:
    metadata:
      labels:
        app: recommendation-engine
    spec:
      containers:
        - name: recommendation-engine
          image: weatherhubredisacr.azurecr.io/weatherhub-recommendation-engine:latest
          ports:
            - containerPort: 5003
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: weatherhub-secrets
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weatherhub-secrets
                  key: redis-password
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-engine
  namespace: weatherhub
spec:
  selector:
    app: recommendation-engine
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
  type: ClusterIP
